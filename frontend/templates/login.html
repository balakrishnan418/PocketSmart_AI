{% extends "base.html" %}
{% block title %}Login · PocketSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form id="loginForm" class="form-card">
    <p class="eyebrow">WELCOME BACK</p><h1>Login</h1>
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" required></label>
    <button class="btn primary" type="submit">Login</button>
    <p id="formMsg" class="msg"></p>
    <p>New here? <a href="/register">Create an account</a></p>
  </form>
</section>
{% endblock %}
{% block scripts %}<script>bindAuthForm("loginForm","/api/login","/dashboard");</script>{% endblock %}
