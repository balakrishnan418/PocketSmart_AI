{% extends "base.html" %}
{% block title %}Register · PocketSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form id="registerForm" class="form-card">
    <p class="eyebrow">GET STARTED</p><h1>Create account</h1>
    <label>Name<input name="name" required minlength="2"></label>
    <label>Email<input name="email" type="email" required></label>
    <label>Password<input name="password" type="password" minlength="6" required></label>
    <button class="btn primary" type="submit">Register</button>
    <p id="formMsg" class="msg"></p>
    <p>Already have an account? <a href="/login">Login</a></p>
  </form>
</section>
{% endblock %}
{% block scripts %}<script>bindAuthForm("registerForm","/api/register","/login");</script>{% endblock %}
